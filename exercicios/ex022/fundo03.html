<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem de Fundo para Sites</title>
    <link rel="shortcut icon" href="imagens/icon/favicon-32x32 copy.png" type="image/x-icon">
    <style>
        div.linha {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }

        div.bloco {
            background-image: url(imagens/wallpaper003.jpg);
            height: 200px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div#q1 {
            background-position: left top;
        }

        div#q2 {
            background-position: left center;
        }

        div#q3 {
            background-position: right bottom;
        }

        div#q4 {
            background-position: center center;
        }

        div#q5 {
            background-position: center top;
        }

        div#q6 {
            background-position: center bottom;
        }

        div#q7 {
            background-position: left bottom;
        }

        div#q8 {
            background-position: right top;
        }

        div#q9 {
            background-position: right center;
        }
    </style>
</head>
<body>
    <div class="linha">
        <div class="bloco" id="q1">
        </div>
        <div class="bloco" id="q2">
        </div>
        <div class="bloco" id="q3">
        </div>
    </div>

    <div class="linha">
        <div class="bloco" id="q4">
        </div>
        <div class="bloco" id="q5">
        </div>
        <div class="bloco" id="q6">
        </div>
    </div>

    <div class="linha">
        <div class="bloco" id="q7">
        </div>
        <div class="bloco" id="q8">
        </div>
        <div class="bloco" id="q9">
        </div>
    </div>
</body>
</html>
