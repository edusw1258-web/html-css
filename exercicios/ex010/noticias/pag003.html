<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terceira página</title>
    <style>
        body {
            background-color: rgb(141, 165, 236);
            font-family: Arial, Helvetica, sans-serif;
            min-height: 98vh;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
        }

        header {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-weight: 800;
            letter-spacing: 2px;
        }

        main {
            background-color: black;
            margin: 60px;
            padding: 20px;
            width: 90%;
            border-radius: 10px;
        }

        p {
            color: rgb(255, 255, 255);
            letter-spacing: 2px;
        }

        a {
            color: gray;
        }

        a:hover {
            color: blue;
        }

        footer {
            text-align: center;
            margin-top: auto;
            font-size: 14px;
            color: rgb(0, 0, 0);
            opacity: 1.2;
        }

        footer p {
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-style: italic;
            color: rgb(116, 109, 109);
        }
    </style>
</head>
<body>
    <header>
        <h1>Terceira página</h1>
    </header>

    <main>
        <p>Está é a terceira página</p>
        <p>Se quiser voltar para a página inicial, basta clicar aqui: <a href="../index.html" rel="prev">Voltar</a></p>
    </main>

    <footer>
        <p>&copy;Gabriel Eduardo</p>
    </footer>
</body>
</html>
