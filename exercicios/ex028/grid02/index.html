<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.container {
            border: 3px solid blue;
            display: grid;
            /* 'columns' cria colunas e 'rows' cria linhas. As configurações de 'auto' indica que serão criadas 3 cada, de tamanho automático, ou seja, que se adapta ao tamanho do container (elemento pai) */
            grid-template-columns: repeat(3, auto);
            grid-template-rows: repeat(3, 120px);
            grid-auto-flow: row; /* Define a direção da quebra dos itens (row ou column) */
            grid-auto-rows: 80px; /* Define o tamanho das linhas criadas automaticamente com as quebras*/
            grid-auto-columns: 120px; /* Define o tamanho das colunas criadas automaticamente com as quebras*/
            gap: 10px;
            align-items: normal;
            justify-items: normal;
            align-content: normal;
            justify-content: normal;
        }

        div.item {
            border: 3px solid red;
            padding: 5px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
