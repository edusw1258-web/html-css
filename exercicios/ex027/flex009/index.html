<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightblue;
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: lightgreen;
            border: 1px solid black;
            padding: 2px;
            text-align: center;
            flex-basis: auto;
        }
    </style>
</head>
<body>
    <div class="container">
       <div class="item">Menor</div>
       <div class="item"> --- Médio --- </div>
       <div class="item"> ------- Maior ------- </div>
       <div class="item">D</div>
       <div class="item">E</div>
       <div class="item"> ------------ Maior ainda ------------ </div>
       <div class="item">G</div>
       <div class="item">H</div> 
    </div>
</body>
</html>
