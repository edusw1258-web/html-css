<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightblue;
            display: flex; 
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightgreen;
            border: 1px solid black;
            text-align: center;
        }

        /* a propriedade 'flex' é o shorthand para 'flex-grow', 'flex-shrink' e 'flex-basis', nessa mesma ordem */
        div#cxA {
            /* flex-grow: 0;
            flex-shrink: 1;
            flex-basis: 200px; */

            flex: 0 1 200px;
        }

        div#cxB {
            /* flex-grow: 4;
            flex-shrink: 1;
            flex-basis: 150px; */

            flex: 4 1 200px;
        }

        div#cxC {
            /* flex-grow: 2; 
            flex-shrink: 2;
            flex-basis: 200px; */

            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
       <div class="item" id="cxA">A</div>
       <div class="item" id="cxB">B</div>
       <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
