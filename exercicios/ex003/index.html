<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com imagens</title>
    <link rel="shortcut icon" href="icon/favicon-32x32.png" type="image/x-icon">
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            font: 1em sans-serif;
            background-color: rgb(218, 218, 218);
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin: 0px 0px 80px 0px;
            padding: 30px 20px;
        }

        header h1 {
            margin-bottom: 0;
        }

        header p {
            font-size: 14px;
            color: #555;    
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        main {
            width: 90%;
            max-width: 800px;
            margin: 0 auto;

            display: grid; /* Faz com que os elementos sejam organizados em grade (linhas e colunas) */
            grid-template-columns: repeat(3, 1fr); /* Divide o body em 3 colunas iguais (1fr) */
            gap: 20px; /* Espaçamento entre os elementos da grade */
        }

        .card {
            background: #b6b6b6;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.2s;
        }


        /* Aumenta o tamanho do card ao passar o mouse por cima */
        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            max-width: 150px;
            margin-bottom: 15px;
        }

        footer {
            margin-top: auto;
        }
        
        footer p {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-style: italic;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <header>
        <h1>Curso de HTML5 e CSS3 - Curso em Vídeo</h1>
        <p>Exercício 003 - Imagens em HTML</p>
    </header>
    <main>
        <div class="card">
            <img class="logohtml" src="imagens/logohtml200.png" alt="Logo HTML5">
            <p>Imagem local (HTML5)</p>
        </div>

        <div class="card">
            <img class="logocss" src="imagens/cssnw2.png" alt="Logo CSS3">
            <p>Imagem local (CSS3)</p>
        </div>

        <div class="card">
            <img class="logojs" src="https://brandlogovector.com/wp-content/uploads/2020/07/JavaScript-Logo-Small.png" alt="Logo JavaScript">
            <p>Imagem externa (JavaScript)</p>
        </div>
    </main>
    <footer>
        <p>&copy; Gabriel Eduardo</p>
    </footer>
</body>
</html>
